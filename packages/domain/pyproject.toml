[project]
name = "mrittika-domain"
version = "0.1.0"
description = "Shared domain vocabulary, canonical record schema and state machine"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mrittika_domain*"]
