# GeoServer, publishing the approved cadastre as WMS/WFS (§11).
#
# An OVERLAY, not part of the default stack:
#
#   docker compose -f docker-compose.yml \
#                  -f infrastructure/docker/compose.geoserver.yml up -d
#
# It is opt-in because it is the one component here that does not speak the
# application's authorization. GeoServer has no notion of a principal: it
# serves whatever it is pointed at, to whoever reaches it. What makes that safe
# is WHAT it is pointed at -- the gis_published_parcels view, which carries
# approved parcels and no ownership (see migration b2c3d4e5f6a7) -- and the
# fact that its port is bound to localhost below.
#
# Before exposing this beyond localhost you must put a reverse proxy with
# authentication in front of it. See docs/gis-integration.md.

name: mrittika-ai

services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    container_name: mrittika-geoserver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Changed on first boot; the upstream image ships geoserver/geoserver.
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-change_me_locally}
      # No sample data: the demo layers ship world-readable and this instance
      # should serve exactly one thing.
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${GEOSERVER_CORS_ORIGINS:-http://localhost:3000}
    ports:
      # 127.0.0.1 on purpose. Dropping the host prefix publishes the cadastre
      # to every interface on the machine.
      - "127.0.0.1:${GEOSERVER_PORT:-8600}:8080"
    volumes:
      - geoserverdata:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  geoserverdata:
