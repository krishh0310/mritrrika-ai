# Mrittika AI — the full §75 stack, all in Docker.
#
# web + api + worker + postgres + redis + minio, one command:
#
#   docker compose -f infrastructure/docker/compose.full.yml up --build
#
# ARCHITECTURE WARNING: build and run this on x86_64. paddlepaddle publishes no
# reliable linux/arm64 wheel, so the worker image cannot be built natively on
# Apple Silicon and emulating it makes OCR far too slow to demonstrate. On a
# Mac, use the root docker-compose.yml (infrastructure only) and run the API,
# worker and web app natively. See docs/architecture.md "Runtime topology".
#
# Paths are relative to this file, so every build context reaches back to the
# repository root.

name: mrittika-ai-full

services:
  postgres:
    build:
      context: ./postgres
    image: mrittika/postgres-postgis-pgvector:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mrittika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrittika}
      POSTGRES_DB: ${POSTGRES_DB:-mrittika}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrittika}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mrittika}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mrittika-dev-secret}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the buckets once, then exits. `restart: no` so a completed run does
  # not look like a crash loop in `docker compose ps`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mrittika}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mrittika-dev-secret}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/mrittika-documents &&
        mc mb --ignore-existing local/mrittika-derived &&
        echo 'buckets ready'
      "
    restart: "no"

  # Migrates and seeds, then exits. Everything that needs a populated database
  # waits on it completing successfully.
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mrittika}:${POSTGRES_PASSWORD:-mrittika}@postgres:5432/${POSTGRES_DB:-mrittika}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: >
      /bin/sh -c "
        alembic -c apps/api/alembic.ini upgrade head &&
        python scripts/seed_demo.py
      "
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mrittika}:${POSTGRES_PASSWORD:-mrittika}@postgres:5432/${POSTGRES_DB:-mrittika}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUTH_STATE_REDIS_URL: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-mrittika}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mrittika-dev-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.6-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      ENVIRONMENT: docker
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/ready'));
          raise SystemExit(0 if data.get('ready') else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mrittika}:${POSTGRES_PASSWORD:-mrittika}@postgres:5432/${POSTGRES_DB:-mrittika}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-mrittika}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mrittika-dev-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      OCR_PROVIDER: ${OCR_PROVIDER:-paddle}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.6-flash}
    volumes:
      # Model weights survive a restart rather than being re-downloaded.
      - modelcache:/app/models

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web/Dockerfile
      args:
        # Baked into the browser bundle at build time, so it must be the URL
        # the BROWSER will use — not the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
