[alembic]
# Resolve from this file, not the caller's working directory. All documented
# commands run from the repository root with `-c apps/api/alembic.ini`.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# URL comes from app.config.settings at runtime -- never hard-coded here,
# so a migration cannot be pointed at the wrong database by a stale file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
